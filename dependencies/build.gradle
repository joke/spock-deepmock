plugins {
    id 'java-platform'
    id 'spock-deepmock.conventions'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.apache.groovy:groovy-bom:6.0.0')
    api platform('org.spockframework:spock-bom:2.4-groovy-4.0')

    api 'net.bytebuddy:byte-buddy:1.17.4'
    api 'org.objenesis:objenesis:3.3'
    api 'org.slf4j:slf4j-simple:2.0.17'

    constraints {
        api 'org.mockito:mockito-core:5.23.0'
        api 'org.projectlombok:lombok:1.18.46'
    }
}
