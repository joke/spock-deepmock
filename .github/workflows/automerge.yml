name: automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Enables auto-merge on the maintainer's own pull requests. GitHub merges once the required checks
  # pass. Pull requests from other people, Dependabot and release-please are never touched here: they
  # wait for a maintainer to merge them.
  automerge:
    if: ${{ github.event.pull_request.user.login == 'joke' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
    - run: gh pr merge --auto --rebase "$PR_URL"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
