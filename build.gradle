plugins {
    id 'idea'
}

// Every subproject gets its repositories from spock-deepmock.conventions. The root does not apply
// it, but nmcp adds com.gradleup.nmcp:nmcp-tasks to an 'nmcpTasks' configuration on the root
// project through the aggregation plugin below, which needs a repository to resolve from.
repositories {
    mavenCentral()
}

// com.gradleup.nmcp.settings (applied in settings.gradle) implicitly applies
// com.gradleup.nmcp.aggregation to this root project - configure the extension it registers
// here rather than re-applying the plugin.
nmcpAggregation {
    // rootProject.name ('spock-deepmock') intentionally collides with the ':spock-deepmock' module's
    // own project name. Harmless for Central Portal coordinates, which key off group+artifactId.
    allowDuplicateProjectNames.set(true)
}
